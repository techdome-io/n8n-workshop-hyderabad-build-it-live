services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.48.7}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    entrypoint: ["sh", "-c", 'if [ -f /setup/first-run.sh ]; then sh /setup/first-run.sh; else exec n8n start; fi']
    volumes:
      - n8n_data:/home/node/.n8n
      - ./setup:/setup:ro
      - ./workflows:/workflows:ro
volumes:
  n8n_data:
